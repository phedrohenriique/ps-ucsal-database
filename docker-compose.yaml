services:
  db:
    image: postgres:16
    container_name: db
    restart: always
    env_file: "./.env"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME} # database name not the connection url
    ports:
      - "5433:5432" # host_machine/container - port 5433 running machine ---> port 5432 container
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql # database initial script

volumes:
  postgres_data: